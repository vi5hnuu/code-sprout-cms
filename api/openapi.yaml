      security: []
      responses:
        "200":
          description: Problem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemListItem" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/run:
    post:
      tags: [judging]
      operationId: runSnippet
      summary: Run a code snippet (articles, playground). Anonymous allowed, rate limited.
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language, code]
              additionalProperties: false
              properties:
                language: { $ref: "#/components/schemas/Language" }
                code: { type: string, maxLength: 65536 }
                stdin: { type: string, maxLength: 65536 }
      responses:
        "202": { $ref: "#/components/responses/RunTicket" }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/run/{runId}:
    get:
      tags: [judging]
      operationId: getRunResult
      summary: Poll a run you started (kept 15 minutes).
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Progress or result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunResult" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/problems/{id}/run:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [judging]
      operationId: runProblem
      summary: Run code on the problem's samples, or on custom input. Nothing is recorded.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language, code]
              additionalProperties: false
              properties:
                language: { $ref: "#/components/schemas/Language" }
                code: { type: string, maxLength: 65536 }
                input: { type: [string, "null"], description: Custom stdin; omit to run the samples. }
      responses:
        "202": { $ref: "#/components/responses/RunTicket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/me/submissions:
    post:
      tags: [judging]
      operationId: submitSolution
      summary: Submit for judging against the hidden tests; poll GET until status is DONE.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [problemId, language, code]
              additionalProperties: false
              properties:
                problemId: { type: integer, format: int64 }
                language: { $ref: "#/components/schemas/Language" }
                code: { type: string, maxLength: 65536 }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
    get:
      tags: [judging]
      operationId: listSubmissions
      summary: Your submissions, newest first (code omitted), optionally for one problem.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: problemId, in: query, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of submissions
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Submission" } }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/me/submissions/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [judging]
      operationId: getSubmission
      summary: One of your submissions, with its code and verdict.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/me/problem-state:
    get:
      tags: [judging]
      operationId: getProblemState
      summary: Attempted / solved for up to 100 problems.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ids, in: query, required: true, schema: { type: string }, example: "12,40" }
      responses:
        "200":
          description: State by problem id
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: object
                    additionalProperties:
                      type: object
                      required: [attempted, solved]
                      properties:
                        attempted: { type: boolean }
                        solved: { type: boolean }
                        solvedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/me/solved:
    get:
      tags: [judging]
      operationId: listSolved
      summary: Problems you solved, most recent first.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [problemId, solvedAt]
                      properties:
                        problemId: { type: integer, format: int64 }
                        solvedAt: { type: string, format: date-time }
                  nextCursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/me/stats:
    get:
      tags: [judging]
      operationId: getMyStats
      summary: Solved counts, streaks, a year of activity and languages.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStats" }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/me/notes:
    get:
      tags: [library]
      operationId: listNotes
      summary: Items you have notes on, most recently edited first.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/SavedPage" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/me/notes/{contentId}:
    parameters: [{ $ref: "#/components/parameters/ContentID" }]
    get:
      tags: [library]
      operationId: getNote
      summary: Your private note on an item.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [library]
      operationId: putNote
      summary: Save your note; an empty body deletes it (204).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 65536 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/me/collections:
    get:
      tags: [library]
      operationId: listMyCollections
      summary: Your lists; `containing` narrows to the lists that hold an item.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: containing, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Lists
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Collection" } }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [library]
      operationId: createCollection
      summary: Create a list (any reader) or an editorial series/course/study plan (site-wide EDITOR).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/me/collections/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    put:
      tags: [library]
      operationId: updateCollection
      summary: Rename, describe or change visibility.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [library]
      operationId: deleteCollection
      summary: Delete a collection.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/me/collections/{id}/items/{contentId}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { $ref: "#/components/parameters/ContentID" }
    put:
      tags: [library]
      operationId: addCollectionItem
      summary: Append a live item (idempotent).
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Added }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [library]
      operationId: removeCollectionItem
      summary: Remove an item.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/me/collections/{id}/order:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    put:
      tags: [library]
      operationId: reorderCollection
      summary: Set the full order; list every current item exactly once.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentIds]
              properties:
                contentIds: { type: array, items: { type: integer, format: int64 } }
      responses:
        "204": { description: Reordered }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/public/collections/{kind}/{slug}:
    get:
      tags: [library]
      operationId: getEditorialCollection
      summary: A public series, course or study plan with its items in order.
      security: []
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [series, course, study_plan] } }
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/CollectionView" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/public/lists/{id}:
    get:
      tags: [library]
      operationId: getList
      summary: A reader's list (public/unlisted, or your own private list when signed in).
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/CollectionView" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/public/search:
    get:
      tags: [search]
      operationId: search
      summary: Full-text search over live public content.
      description: |
        Ranked by relevance, so paging is by offset (capped at 1000). Matches in `title` and
        `snippet` are wrapped in U+E000 … U+E001: HTML-escape the text, then replace the markers
        with <mark> tags.
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
        - { name: type, in: query, schema: { type: string, enum: [article, blog, problem, topic_page, quiz] } }
        - { name: difficulty, in: query, schema: { $ref: "#/components/schemas/Difficulty" } }
        - { name: locale, in: query, schema: { type: string, default: en } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 } }
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/admin/search/reindex:
    post:
      tags: [search]
      operationId: reindexSearch
      summary: Rebuild the search index from the database (ADMIN). Runs in the worker, chunk by chunk.
      security: [{ bearerAuth: [] }]
      responses:
        "202": { description: Started }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/public/sitemaps:
    get:
      tags: [search]
      operationId: listSitemaps
      summary: Sitemap chunks for the sitemap index.
      description: Each chunk is a fixed id range of 50,000 per type, so older chunks rarely change.
      security: []
      responses:
        "200":
          description: Chunks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [type, chunk, urlCount, lastmod]
                      properties:
                        type: { $ref: "#/components/schemas/ContentType" }
                        chunk: { type: integer }
                        urlCount: { type: integer }
                        lastmod: { type: string, format: date-time }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/public/sitemaps/{type}/{chunk}:
    get:
      tags: [search]
      operationId: getSitemapChunk
      summary: The site paths in one sitemap chunk.
      security: []
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [article, blog, problem, topic_page, quiz] } }
        - { name: chunk, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [path, lastmod]
                      properties:
                        path: { type: string, description: "Canonical site path, e.g. /dsa/binary-search." }
                        lastmod: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from the shared auth service (audience `code-sprout-cms`).

  parameters:
    ContentID:
      name: contentId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    CommentID:
      name: commentId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The draft ETag you loaded, e.g. "12".
      schema: { type: string }
    Rev:
      name: rev
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`. Omit for the first page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ProblemStudio:
      description: The problem's judging setup
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProblemStudio" }
    RunTicket:
      description: Started; poll GET /v1/run/{runId}
      content:
        application/json:
          schema:
            type: object
            required: [runId, pollAfterMs]
            properties:
              runId: { type: string }
              pollAfterMs: { type: integer }
    CollectionView:
      description: Collection with a page of items
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Collection"
              - type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ListItem" } }
                  nextCursor: { type: [string, "null"] }
    SavedPage:
      description: Page of saved items
      content:
        application/json:
          schema:
            type: object
            required: [items, nextCursor]
            properties:
              items:
                type: array
                items:
                  type: object
                  required: [savedAt, item]
                  properties:
                    savedAt: { type: string, format: date-time }
                    listId: { type: [integer, "null"], format: int64 }
                    item: { $ref: "#/components/schemas/ListItem" }
              nextCursor: { type: [string, "null"] }
    CommentPage:
      description: Page of comments
      content:
        application/json:
          schema:
            type: object
            required: [items, nextCursor]
            properties:
              items: { type: array, items: { $ref: "#/components/schemas/Comment" } }
              nextCursor: { type: [string, "null"] }
    Draft:
      description: The item's studio view
      headers:
        ETag:
          description: Draft revision; send it as If-Match on the next save.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Draft" }
    StaleRevision:
      description: "Someone saved first (`content.stale_revision`); `details.currentRevNo` is the newer revision. Reload, then save."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotPublishable:
      description: "Not publishable yet (`content.not_publishable`); `details.issues` lists every blocker with its field or line."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Bad Request }
        status: { type: integer, example: 400 }
        detail: { type: string }
        code:
          type: string
          description: Stable identifier clients may switch on, e.g. `content.slug_taken`.
          example: validation_failed
        errors:
          type: object
          description: Per-field messages for validation failures.
          additionalProperties: { type: string }
        requestId: { type: string, description: Quote this when reporting a problem. }

    CmsRole:
      type: string
      enum: [CONTRIBUTOR, REVIEWER, EDITOR, ADMIN]

    RoleGrant:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/CmsRole" }
        scopeCategoryId:
          type: integer
          format: int64
          description: The role applies within this category subtree only. Absent means everywhere.

    Me:
      type: object
      required: [id, handle, displayName, bio, avatarFileId, createdAt, roles, isAdmin, isGuest]
      properties:
        id: { type: integer, format: int64 }
        handle: { type: [string, "null"], description: "Public profile handle, used in /u/{handle}." }
        displayName: { type: string }
        bio: { type: [string, "null"] }
        avatarFileId: { type: [integer, "null"], format: int64 }
        createdAt: { type: string, format: date-time }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleGrant" }
        isAdmin: { type: boolean, description: "Auth ROLE_ADMIN, which grants every CMS permission." }
        isGuest: { type: boolean, description: "Guest account: may read and react, cannot author." }

    Category:
      type: object
      required: [id, parentId, path, slug, name, description, position, seo, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        parentId: { type: [integer, "null"], format: int64 }
        path: { type: string, description: "Slash-separated slug path, e.g. dsa/algorithms." }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        position: { type: number, description: Sibling order (ascending). }
        seo: { type: object, description: Meta title/description overrides. }
        updatedAt: { type: string, format: date-time }
    CategoryView:
      allOf:
        - $ref: "#/components/schemas/Category"
        - type: object
          required: [ancestors, children]
          properties:
            ancestors:
              description: Root-first breadcrumb, excluding this category.
              type: array
              items: { $ref: "#/components/schemas/Category" }
            children:
              type: array
              items: { $ref: "#/components/schemas/Category" }
    CreateCategory:
      type: object
      required: [slug, name]
      additionalProperties: false
      properties:
        parentId: { type: [integer, "null"], format: int64, description: Omit for a top-level section. }
        slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 80 }
        name: { type: string, maxLength: 120 }
        description: { type: [string, "null"] }
        position: { type: number, description: Omit to append after the last sibling. }
    UpdateCategory:
      type: object
      required: [name, position]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: [string, "null"] }
        seo: { type: object }
        position: { type: number }
    MoveCategory:
      type: object
      required: [slug]
      additionalProperties: false
      properties:
        parentId: { type: [integer, "null"], format: int64, description: null makes it top-level (ADMIN). }
        slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 80 }

    TagKind:
      type: string
      enum: [TOPIC, COMPANY, LANGUAGE, PATTERN]
    Tag:
      type: object
      required: [id, kind, slug, name, description]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/TagKind" }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
    TagPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        nextCursor: { type: [string, "null"], description: Pass as `cursor` for the next page; null on the last. }
    CreateTag:
      type: object
      required: [kind, slug, name]
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/TagKind" }
        slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 80 }
        name: { type: string, maxLength: 120 }
        description: { type: [string, "null"] }
    UpdateTag:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: [string, "null"] }

    FilePurpose:
      type: string
      enum: [ASSET, AVATAR, TEST_SET, CHECKER]
      description: |
        ASSET: png/jpeg/webp/gif ≤ 10 MiB, mp4/webm ≤ 500 MiB (public).
        AVATAR: png/jpeg/webp ≤ 2 MiB (public).
        TEST_SET: zip or ndjson ≤ 1 GiB (private). CHECKER: text/plain ≤ 1 MiB (private).
    File:
      type: object
      required: [id, purpose, mime, sizeBytes, status, width, height, url]
      properties:
        id: { type: integer, format: int64 }
        purpose: { $ref: "#/components/schemas/FilePurpose" }
        mime: { type: string }
        sizeBytes: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, VERIFYING, READY, QUARANTINED] }
        width: { type: [integer, "null"], description: Images only. }
        height: { type: [integer, "null"] }
        url: { type: [string, "null"], description: Public files once READY; private files never have one. }
    CreateUpload:
      type: object
      required: [purpose, mime, sizeBytes, sha256]
      additionalProperties: false
      properties:
        purpose: { $ref: "#/components/schemas/FilePurpose" }
        mime: { type: string, example: image/png }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "SHA-256 of the exact bytes to upload, as hex." }
    UploadTicket:
      type: object
      required: [file, upload, alreadyUploaded]
      properties:
        file: { $ref: "#/components/schemas/File" }
        alreadyUploaded: { type: boolean }
        upload:
          oneOf:
            - type: "null"
            - type: object
              required: [url, method, headers, expiresAt]
              properties:
                url: { type: string }
                method: { type: string, enum: [PUT] }
                headers:
                  type: object
                  additionalProperties: { type: string }
                  description: Send every one exactly; they are part of the signature.
                expiresAt: { type: string, format: date-time }

    ContentType: { type: string, enum: [ARTICLE, BLOG, PROBLEM, TOPIC_PAGE, QUIZ] }
    ContentStatus: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
    ReviewState: { type: string, enum: [NONE, IN_REVIEW, CHANGES_REQUESTED, APPROVED, SCHEDULED] }
    Meta:
      type: object
      description: Draft metadata, versioned with the body. It becomes the live face at publish.
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        slug: { type: string, maxLength: 120, description: Derived from the title when empty. }
        summary: { type: [string, "null"], maxLength: 300, description: "Required (50+ characters) to publish; search results show it." }
        categoryId: { type: [integer, "null"], format: int64, description: Required to publish. }
        tagIds: { type: array, maxItems: 10, items: { type: integer, format: int64 } }
        visibility: { type: string, enum: [PUBLIC, UNLISTED, PRIVATE], default: PUBLIC }
        access: { type: string, enum: [FREE, PREMIUM], default: FREE }
        article:
          type: object
          properties:
            level: { type: [string, "null"], enum: [BEGINNER, INTERMEDIATE, ADVANCED, null] }
        blog:
          type: object
          properties:
            coverFileId: { type: [integer, "null"], format: int64 }
    DraftInput:
      description: Full replacement of the draft.
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          required: [body]
          properties:
            body: { type: string, description: "Sprout Markdown (docs/sprout-markdown.md), at most 1 MiB." }
            message: { type: [string, "null"], maxLength: 500, description: Optional revision note. }
    CreateContent:
      allOf:
        - $ref: "#/components/schemas/DraftInput"
        - type: object
          required: [type]
          properties:
            type: { type: string, enum: [ARTICLE, BLOG, TOPIC_PAGE] }
            locale: { type: string, default: en }
    MarkdownIssue:
      type: object
      required: [line, code, message]
      properties:
        line: { type: integer }
        code: { type: string }
        message: { type: string }
    LiveFace:
      type: object
      required: [slug, title, revNo]
      properties:
        slug: { type: string }
        title: { type: string }
        revNo: { type: integer }
    Draft:
      type: object
      required: [id, type, locale, status, reviewState, scheduledAt, authorId, draftRevNo, hasUnpublishedChanges, live, publishedAt, lastPublishedAt, updatedAt, meta, body, issues]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/ContentType" }
        locale: { type: string }
        status: { $ref: "#/components/schemas/ContentStatus" }
        reviewState: { $ref: "#/components/schemas/ReviewState" }
        scheduledAt: { type: [string, "null"], format: date-time }
        authorId: { type: integer, format: int64 }
        draftRevNo: { type: integer }
        hasUnpublishedChanges: { type: boolean }
        live:
          description: What readers see now; null if never published.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LiveFace"
        publishedAt: { type: [string, "null"], format: date-time }
        lastPublishedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
        meta: { $ref: "#/components/schemas/Meta" }
        body: { type: string }
        issues:
          description: Markdown problems; must be empty to submit or publish.
          type: array
          items: { $ref: "#/components/schemas/MarkdownIssue" }
    ContentSummary:
      type: object
      required: [id, type, locale, title, slug, status, reviewState, authorId, draftRevNo, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/ContentType" }
        locale: { type: string }
        title: { type: string }
        slug: { type: string }
        status: { $ref: "#/components/schemas/ContentStatus" }
        reviewState: { $ref: "#/components/schemas/ReviewState" }
        authorId: { type: integer, format: int64 }
        draftRevNo: { type: integer }
        updatedAt: { type: string, format: date-time }
    ContentSummaryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ContentSummary" } }
        nextCursor: { type: [string, "null"] }
    Revision:
      type: object
      required: [revNo, editorId, message, createdAt, archived]
      properties:
        revNo: { type: integer }
        editorId: { type: integer, format: int64 }
        message: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        archived: { type: boolean }
    RevisionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Revision" } }
        nextCursor: { type: [string, "null"] }
    RevisionDetail:
      allOf:
        - $ref: "#/components/schemas/Revision"
        - type: object
          required: [meta, body]
          properties:
            meta: { $ref: "#/components/schemas/Meta" }
            body: { type: string }
    ReviewNote:
      type: object
      required: [anchor, body]
      properties:
        anchor: { type: object, description: "Where the note points, e.g. a line number or heading id." }
        body: { type: string }
    ReviewInput:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision: { type: string, enum: [APPROVED, CHANGES_REQUESTED] }
        summary: { type: [string, "null"] }
        notes: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/ReviewNote" } }
    Review:
      type: object
      required: [id, revNo, reviewerId, decision, summary, notes, createdAt]
      properties:
        id: { type: integer, format: int64 }
        revNo: { type: integer, description: The draft revision that was reviewed. }
        reviewerId: { type: integer, format: int64 }
        decision: { type: string, enum: [APPROVED, CHANGES_REQUESTED] }
        summary: { type: [string, "null"] }
        notes: { type: array, items: { $ref: "#/components/schemas/ReviewNote" } }
        createdAt: { type: string, format: date-time }
    ScheduleInput:
      type: object
      required: [at]
      additionalProperties: false
      properties:
        at: { type: string, format: date-time, description: Between one minute and one year from now. }

    UpdateProfile:
      type: object
      required: [displayName]
      additionalProperties: false
      properties:
        handle: { type: [string, "null"], pattern: "^[a-z0-9](?:[a-z0-9_-]{1,28}[a-z0-9])?$" }
        displayName: { type: string, maxLength: 60 }
        bio: { type: [string, "null"], maxLength: 300 }
        avatarFileId: { type: [integer, "null"], format: int64, description: A READY upload with purpose AVATAR. }
    PublicUser:
      type: object
      required: [id, handle, displayName, bio, avatarUrl]
      properties:
        id: { type: integer, format: int64 }
        handle: { type: [string, "null"] }
        displayName: { type: string }
        bio: { type: [string, "null"] }
        avatarUrl: { type: [string, "null"] }
    Stats:
      type: object
      required: [views, likes, comments, bookmarks, shares]
      properties:
        views: { type: integer, format: int64 }
        likes: { type: integer, format: int64 }
        comments: { type: integer, format: int64 }
        bookmarks: { type: integer, format: int64 }
        shares: { type: integer, format: int64 }
    Heading:
      type: object
      required: [level, text, id]
      properties:
        level: { type: integer, enum: [2, 3] }
        text: { type: string }
        id: { type: string, description: Anchor id (docs/sprout-markdown.md heading ids). }
    PublicLink:
      type: object
      required: [kind, id, type, locale, slug, title, path]
      properties:
        path: { type: string, description: "Canonical site path of the target." }
        kind: { type: string, enum: [PRACTICE, RELATED, PREREQUISITE, EDITORIAL] }
        id: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/ContentType" }
        locale: { type: string }
        slug: { type: string }
        title: { type: string }
    PublicPage:
      type: object
      required: [id, type, locale, slug, title, summary, access, unlisted, locked, body, toc, readingMinutes, wordCount, publishedAt, lastPublishedAt, author, breadcrumb, tags, assets, links, stats]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/ContentType" }
        locale: { type: string }
        slug: { type: string }
        title: { type: string }
        summary: { type: [string, "null"] }
        access: { type: string, enum: [FREE, PREMIUM] }
        unlisted: { type: boolean, description: Render with robots noindex. }
        locked: { type: boolean, description: PREMIUM; the body is not in this response. }
        body: { type: [string, "null"], description: Sprout Markdown. }
        toc: { type: array, items: { $ref: "#/components/schemas/Heading" } }
        readingMinutes: { type: integer }
        wordCount: { type: integer }
        publishedAt: { type: string, format: date-time }
        lastPublishedAt: { type: string, format: date-time }
        author: { $ref: "#/components/schemas/PublicUser" }
        breadcrumb: { type: array, items: { $ref: "#/components/schemas/Category" } }
        tags: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        assets:
          type: object
          description: "File by id: resolves `asset:<id>` references in the body."
          additionalProperties: { $ref: "#/components/schemas/File" }
        links: { type: array, items: { $ref: "#/components/schemas/PublicLink" } }
        article:
          type: object
          properties:
            level: { type: [string, "null"] }
        blog:
          type: object
          properties:
            cover:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/File"
        stats: { $ref: "#/components/schemas/Stats" }
    ListItem:
      type: object
      required: [id, type, locale, slug, title, summary, access, publishedAt, lastPublishedAt, readingMinutes, category, author, stats]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/ContentType" }
        locale: { type: string }
        slug: { type: string }
        title: { type: string }
        summary: { type: [string, "null"] }
        access: { type: string, enum: [FREE, PREMIUM] }
        publishedAt: { type: string, format: date-time }
        lastPublishedAt: { type: string, format: date-time }
        readingMinutes: { type: integer }
        category:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Category"
        author: { $ref: "#/components/schemas/PublicUser" }
        stats: { $ref: "#/components/schemas/Stats" }
    ListItemPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ListItem" } }
        nextCursor: { type: [string, "null"] }

    BookmarkList:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    ItemState:
      type: object
      required: [liked, bookmarked]
      properties:
        liked: { type: boolean }
        bookmarked: { type: boolean }
        bookmarkListId: { type: [integer, "null"], format: int64 }
    Comment:
      type: object
      required: [id, contentId, rootId, parentId, author, body, deleted, replyCount, createdAt, editedAt]
      properties:
        id: { type: integer, format: int64 }
        contentId: { type: integer, format: int64 }
        rootId: { type: [integer, "null"], format: int64, description: The thread's top-level comment; null for top-level comments. }
        parentId: { type: [integer, "null"], format: int64, description: The comment this one answers. }
        author:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PublicUser"
        body: { type: string, description: Markdown; empty when deleted. }
        deleted: { type: boolean }
        replyCount: { type: integer }
        createdAt: { type: string, format: date-time }
        editedAt: { type: [string, "null"], format: date-time }
    CommentReport:
      type: object
      required: [id, contentId, commentId, reporterId, reason, note, commentBody, commentAuthorId, commentStatus, createdAt]
      properties:
        id: { type: integer, format: int64 }
        contentId: { type: integer, format: int64 }
        commentId: { type: integer, format: int64 }
        reporterId: { type: integer, format: int64 }
        reason: { type: string }
        note: { type: [string, "null"] }
        commentBody: { type: string }
        commentAuthorId: { type: integer, format: int64 }
        commentStatus: { type: string }
        createdAt: { type: string, format: date-time }

    Language: { type: string, enum: [c, cpp, csharp, go, java, javascript, kotlin, python, rust, typescript] }
    Difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
    Verdict: { type: string, enum: [AC, WA, TLE, MLE, RE, CE, IE] }
    CreateProblem:
      allOf:
        - $ref: "#/components/schemas/DraftInput"
        - type: object
          required: [difficulty]
          properties:
            difficulty: { $ref: "#/components/schemas/Difficulty" }
            timeLimitMs: { type: integer, minimum: 100, maximum: 30000, default: 2000 }
            memoryMb: { type: integer, minimum: 16, maximum: 1024, default: 256 }
    ProblemSettings:
      type: object
      required: [difficulty, timeLimitMs, memoryMb]
      properties:
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        timeLimitMs: { type: integer, minimum: 100, maximum: 30000 }
        memoryMb: { type: integer, minimum: 16, maximum: 1024 }
        checker: { type: string, enum: [EXACT, TOKEN, FLOAT], default: EXACT }
        checkerFileId: { type: [integer, "null"], format: int64 }
        editorialContentId: { type: [integer, "null"], format: int64 }
    Sample:
      type: object
      required: [input, output]
      properties:
        input: { type: string, maxLength: 16384 }
        output: { type: string, maxLength: 16384 }
        explanation: { type: [string, "null"] }
    ProblemStudio:
      type: object
      required: [contentId, settings, samples, templates, hints, testSets]
      properties:
        contentId: { type: integer, format: int64 }
        settings: { $ref: "#/components/schemas/ProblemSettings" }
        samples: { type: array, items: { $ref: "#/components/schemas/Sample" } }
        templates:
          type: array
          items:
            type: object
            required: [language, starterCode]
            properties:
              language: { $ref: "#/components/schemas/Language" }
              starterCode: { type: string }
              driverCode: { type: [string, "null"] }
        hints: { type: array, items: { type: string } }
        testSets:
          type: array
          items:
            type: object
            required: [id, version, fileId, caseCount, bytes, active, createdAt]
            properties:
              id: { type: integer, format: int64 }
              version: { type: integer }
              fileId: { type: integer, format: int64 }
              caseCount: { type: integer }
              bytes: { type: integer, format: int64 }
              active: { type: boolean }
              createdAt: { type: string, format: date-time }
    ProblemDetail:
      type: object
      required: [difficulty, timeLimitMs, memoryMb, samples, templates, hintCount, editorialContentId, submissionCount, acceptedCount, acceptanceRate]
      properties:
        difficulty: { $ref: "#/components/schemas/Difficulty" }
        timeLimitMs: { type: integer }
        memoryMb: { type: integer }
        samples: { type: array, items: { $ref: "#/components/schemas/Sample" } }
        templates:
          type: array
          items:
            type: object
            required: [language, starterCode]
            properties:
              language: { $ref: "#/components/schemas/Language" }
              starterCode: { type: string }
        hintCount: { type: integer }
        editorialContentId: { type: [integer, "null"], format: int64 }
        submissionCount: { type: integer, format: int64 }
        acceptedCount: { type: integer, format: int64 }
        acceptanceRate: { type: [number, "null"], minimum: 0, maximum: 1 }
    ProblemPage:
      allOf:
        - $ref: "#/components/schemas/PublicPage"
        - type: object
          required: [problem]
          properties:
            problem: { $ref: "#/components/schemas/ProblemDetail" }
    ProblemListItem:
      allOf:
        - $ref: "#/components/schemas/ListItem"
        - type: object
          required: [difficulty, acceptanceRate]
          properties:
            difficulty: { $ref: "#/components/schemas/Difficulty" }
            acceptanceRate: { type: [number, "null"] }
    RunResult:
      type: object
      required: [status, done, cases]
      properties:
        status: { type: string, enum: [pending, running, done, failed] }
        done: { type: boolean }
        cases:
          type: array
          items:
            type: object
            required: [index, verdict]
            properties:
              index: { type: integer }
              verdict: { type: string, description: "A judge verdict, or OK for free-form runs that ran without error." }
              stdout: { type: [string, "null"] }
              stderr: { type: [string, "null"] }
              timeMs: { type: [integer, "null"] }
    Submission:
      type: object
      required: [id, problemId, language, status, verdict, passed, total, timeMs, createdAt, finishedAt]
      properties:
        id: { type: integer, format: int64 }
        problemId: { type: integer, format: int64 }
        language: { $ref: "#/components/schemas/Language" }
        code: { type: string, description: Only on single fetch. }
        status: { type: string, enum: [QUEUED, RUNNING, DONE, FAILED] }
        verdict:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Verdict"
        passed: { type: integer }
        total: { type: integer }
        timeMs: { type: [integer, "null"] }
        failedIndex: { type: integer, description: "0-based; present only when the failing case is a sample." }
        message: { type: string, description: Compiler output or why it could not be judged. }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
    UserStats:
      type: object
      required: [totalSolved, easySolved, mediumSolved, hardSolved, totalSubmissions, currentStreak, longestStreak, activity, languageBreakdown]
      properties:
        totalSolved: { type: integer }
        easySolved: { type: integer }
        mediumSolved: { type: integer }
        hardSolved: { type: integer }
        totalSubmissions: { type: integer, format: int64 }
        currentStreak: { type: integer, description: Consecutive days with a submission ending today or yesterday. }
        longestStreak: { type: integer }
        activity: { type: object, additionalProperties: { type: integer }, description: "YYYY-MM-DD → submissions, last 365 days." }
        languageBreakdown: { type: object, additionalProperties: { type: integer }, description: Language → problems solved in it. }
    Note:
      type: object
      required: [contentId, body, updatedAt]
      properties:
        contentId: { type: integer, format: int64 }
        body: { type: string }
        updatedAt: { type: string, format: date-time }
    CollectionInput:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [LIST, SERIES, COURSE, STUDY_PLAN], default: LIST }
        slug: { type: string }
        title: { type: string, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 1000 }
        visibility: { type: string, enum: [PUBLIC, UNLISTED, PRIVATE], default: PRIVATE }
    Collection:
      type: object
      required: [id, kind, slug, title, description, ownerId, visibility, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [LIST, SERIES, COURSE, STUDY_PLAN] }
        slug: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        ownerId: { type: integer, format: int64 }
        visibility: { type: string, enum: [PUBLIC, UNLISTED, PRIVATE] }
        itemCount: { type: integer }
        updatedAt: { type: string, format: date-time }

    SearchResult:
      type: object
      required: [hits, estimatedTotal, offset, limit]
      properties:
        hits:
          type: array
          items:
            type: object
            required: [id, type, locale, slug, title, snippet, category, publishedAt]
            properties:
              id: { type: integer, format: int64 }
              type: { $ref: "#/components/schemas/ContentType" }
              locale: { type: string }
              slug: { type: string }
              title: { type: string }
              snippet: { type: string }
              category: { type: string }
              difficulty: { type: string }
              publishedAt: { type: integer, description: Unix seconds. }
        estimatedTotal: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
