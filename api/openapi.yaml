openapi: 3.1.0
info:
  title: Code Sprout Content API
  version: 1.0.0
  description: |
    Content API for Code Sprout: articles, blogs, problems, taxonomy and reader engagement.
    This file is the contract. The web client (TypeScript) and the Android app (Kotlin/KMP)
    are generated from it, so change it first and in the same commit as the handler.

    ## Surfaces
    - `/v1/public/**`: anonymous and cacheable (CDN + ISR). Never varies by user.
    - `/v1/me/**`: the signed-in user's own state. Always `Cache-Control: private, no-store`.
    - `/v1/studio/**`: authoring and editorial workflow (CMS roles).
    - `/v1/admin/**`: taxonomy, roles, moderation.

    ## Conventions
    - **Errors** are RFC 9457 `application/problem+json` with a stable machine `code`.
    - **Pagination** is keyset-based. Pass the opaque `nextCursor` back as `cursor`; there are
      no page numbers, so page 10,000 costs the same as page 1.
    - **Concurrency**: draft saves send `If-Match: <revNo>`; a stale value returns 412.
    - **Idempotency**: create-style POSTs accept an `Idempotency-Key` header.
    - **Rate limits**: 429 responses carry `Retry-After` in seconds.
servers:
  - url: http://localhost:9300
    description: Local development

security:
  - {}
  - bearerAuth: []

tags:
  - name: health
    description: Probes for the load balancer and orchestrator.
  - name: me
    description: The signed-in user's own profile and state.
  - name: content
    description: Public pages and listings (cacheable; identical for every reader).
  - name: engagement
    description: Likes, bookmarks, comments, shares and views.
  - name: problems
    description: Practice problems, their judging setup, and the problem of the day.
  - name: judging
    description: Running code, submissions, progress and stats (executed by ls-judge).
  - name: library
    description: A reader's notes and collections.
  - name: search
    description: Search and sitemaps.
  - name: taxonomy
    description: Category tree (site sections) and tags.
  - name: studio
    description: |
      Authoring and the editorial workflow. Each item has two state axes: `status`
      (DRAFT never live, PUBLISHED, ARCHIVED) and the `reviewState` of its pending draft
      (NONE, IN_REVIEW, CHANGES_REQUESTED, APPROVED, SCHEDULED). Readers keep seeing the live
      version until an editor publishes the draft. Draft responses carry `ETag: "<draftRevNo>"`;
      saves and restores must send it back as `If-Match`.
  - name: uploads
    description: |
      Direct-to-storage uploads. 1) POST /v1/studio/uploads with the file's type, size and
      SHA-256. 2) PUT the bytes to `upload.url`, sending every header in `upload.headers`.
      3) POST .../complete. A 202 means a large file is still being verified; poll GET until
      READY. Content references a READY image as `![alt](asset:<id>)`.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness. The process is up; dependencies are not checked.
      security: []
      responses:
        "200": { description: Alive }
  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness. Postgres (primary and replica) and Redis are reachable.
      security: []
      responses:
        "200": { description: Ready to serve traffic }
        "500": { $ref: "#/components/responses/Problem" }

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The signed-in user's CMS profile and editorial roles.
      description: Creates the profile on the user's first authenticated request.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/public/categories:
    get:
      tags: [taxonomy]
      operationId: listRootCategories
      summary: Top-level sections.
      security: []
      responses:
        "200":
          description: Root categories in display order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Category" } }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/public/categories/{path}:
    get:
      tags: [taxonomy]
      operationId: getCategoryByPath
      summary: A category with its breadcrumb and children.
      description: "`path` is the slash-separated slug path, e.g. `dsa/algorithms/searching`."
      security: []
      parameters:
        - { name: path, in: path, required: true, schema: { type: string }, example: dsa/algorithms }
      responses:
        "200":
          description: Category view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryView" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/public/tags:
    get:
      tags: [taxonomy]
      operationId: listTags
      summary: Tags of one kind, alphabetically (keyset-paginated).
      security: []
      parameters:
        - { name: kind, in: query, required: true, schema: { $ref: "#/components/schemas/TagKind" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of tags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagPage" }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/public/tags/search:
    get:
      tags: [taxonomy]
      operationId: searchTags
      summary: Typo-tolerant tag autocomplete (top 20).
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/TagKind" } }
      responses:
        "200":
          description: Matching tags, best first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/public/tags/{kind}/{slug}:
    get:
      tags: [taxonomy]
      operationId: getTag
      summary: One tag, for its listing page header.
      security: []
      parameters:
        - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/TagKind" } }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/admin/categories:
    post:
      tags: [taxonomy]
      operationId: createCategory
      summary: Create a category. Top-level needs ADMIN; a child needs EDITOR on the parent.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCategory" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/categories/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    patch:
      tags: [taxonomy]
      operationId: updateCategory
      summary: Edit name, description, SEO overrides and position (EDITOR on the category).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCategory" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [taxonomy]
      operationId: deleteCategory
      summary: Delete an empty category (no children, no content).
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/categories/{id}/move:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [taxonomy]
      operationId: moveCategory
      summary: Re-parent and/or rename; the whole subtree moves atomically.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveCategory" }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/tags:
    post:
      tags: [taxonomy]
      operationId: createTag
      summary: Create a tag (EDITOR).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTag" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/tags/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    patch:
      tags: [taxonomy]
      operationId: updateTag
      summary: Rename or re-describe a tag (EDITOR). Slug and kind are fixed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTag" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [taxonomy]
      operationId: deleteTag
      summary: Delete a tag and detach it from all content (ADMIN).
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/studio/uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Get a presigned upload URL (or the existing file, if these exact bytes were uploaded before).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUpload" }
      responses:
        "201":
          description: Upload URL issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "200":
          description: Identical file already uploaded; no upload needed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/studio/uploads/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [uploads]
      operationId: getUpload
      summary: Current state of one of your uploads.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: File
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/studio/uploads/{id}/complete:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [uploads]
      operationId: completeUpload
      summary: Verify the uploaded bytes (size, type, SHA-256). Idempotent.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Verified and READY
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "202":
          description: Large file queued for verification (VERIFYING); poll GET
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: "Not uploaded yet (`upload.missing`) or bytes did not match (`upload.mismatch`, `upload.quarantined`)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/studio/content:
    post:
      tags: [studio]
      operationId: createContent
      summary: Start a new article, blog or topic page (any signed-in, non-guest user).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContent" }
      responses:
        "201": { $ref: "#/components/responses/Draft" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      tags: [studio]
      operationId: listMyContent
      summary: The caller's items, most recently updated first.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentSummaryPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/studio/review-queue:
    get:
      tags: [studio]
      operationId: getReviewQueue
      summary: Items waiting on the caller, oldest first, within the categories they cover.
      description: "`IN_REVIEW` for reviewers; `APPROVED` (ready to publish) for editors."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [IN_REVIEW, APPROVED], default: IN_REVIEW } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentSummaryPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/studio/content/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [studio]
      operationId: getDraft
      summary: The current draft, its live face and its Markdown issues.
      description: Visible to the author and to reviewers/editors of its category; 404 for anyone else.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Draft" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [studio]
      operationId: deleteContent
      summary: Soft-delete. Authors may delete their never-published drafts; otherwise EDITOR.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/studio/content/{id}/draft:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    put:
      tags: [studio]
      operationId: saveDraft
      summary: Replace the draft with a new revision (a no-op save writes nothing).
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftInput" }
      responses:
        "200": { $ref: "#/components/responses/Draft" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/StaleRevision" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/studio/content/{id}/revisions:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [studio]
      operationId: listRevisions
      summary: Revision history, newest first (no bodies).
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of revisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/studio/content/{id}/revisions/{rev}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { $ref: "#/components/parameters/Rev" }
    get:
      tags: [studio]
      operationId: getRevision
      summary: One revision with its body and metadata.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/studio/content/{id}/revisions/{rev}/restore:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { $ref: "#/components/parameters/Rev" }
    post:
      tags: [studio]
      operationId: restoreRevision
      summary: Make an old revision the draft again, as a new revision.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200": { $ref: "#/components/responses/Draft" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/StaleRevision" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/studio/content/{id}/reviews:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [studio]
      operationId: listReviews
      summary: Review decisions with inline notes, newest first.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Review" } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/studio/content/{id}/submit:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [studio]
      operationId: submitForReview
      summary: Send the draft to reviewers (author or editor). It must already be publishable.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Draft" }
        "400": { $ref: "#/components/responses/NotPublishable" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/studio/content/{id}/withdraw:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [studio]
      operationId: withdrawFromReview
      summary: Take the draft back from review, or cancel its schedule, so it can be edited.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Draft" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/studio/content/{id}/review:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [studio]
      operationId: reviewContent
      summary: Approve or request changes (REVIEWER in the category; never the author).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200": { $ref: "#/components/responses/Draft" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/studio/content/{id}/publish:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [studio]
      operationId: publishContent
      summary: Make the draft live now (EDITOR in the category).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Draft" }
        "400": { $ref: "#/components/responses/NotPublishable" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/studio/content/{id}/schedule:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [studio]
      operationId: scheduleContent
      summary: Publish an approved draft at a set time (EDITOR).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200": { $ref: "#/components/responses/Draft" }
        "400": { $ref: "#/components/responses/NotPublishable" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/studio/content/{id}/archive:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [studio]
      operationId: archiveContent
      summary: Take a live page down (EDITOR). Publishing again restores it.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Draft" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /v1/me/profile:
    put:
      tags: [me]
      operationId: updateProfile
      summary: Set the public profile (handle, display name, bio, avatar).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfile" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/public/users/{handle}:
