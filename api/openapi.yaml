  /v1/public/content/{type}/{slug}:
    get:
      tags: [content]
      operationId: getPublicPage
      summary: A live item as readers see it.
      description: |
        A renamed item's old slug answers 301 with `Location` and `{redirect: {slug}}`; the web
        app issues its own 301 to the new URL. PREMIUM items are `locked` with no `body`.
      security: []
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [article, blog, problem, topic_page, quiz] } }
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: locale, in: query, schema: { type: string, default: en } }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPage" }
        "301":
          description: The slug was renamed
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [redirect]
                properties:
                  redirect: { type: object, required: [slug], properties: { slug: { type: string } } }
        "404": { $ref: "#/components/responses/Problem" }

