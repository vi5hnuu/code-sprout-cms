openapi: 3.1.0
info:
  title: Code Sprout Content API
  version: 1.0.0
  description: |
    Content API for Code Sprout: articles, blogs, problems, taxonomy and reader engagement.
    This file is the contract. The web client (TypeScript) and the Android app (Kotlin/KMP)
    are generated from it, so change it first and in the same commit as the handler.

    ## Surfaces
    - `/v1/public/**`: anonymous and cacheable (CDN + ISR). Never varies by user.
    - `/v1/me/**`: the signed-in user's own state. Always `Cache-Control: private, no-store`.
    - `/v1/studio/**`: authoring and editorial workflow (CMS roles).
    - `/v1/admin/**`: taxonomy, roles, moderation.

    ## Conventions
    - **Errors** are RFC 9457 `application/problem+json` with a stable machine `code`.
    - **Pagination** is keyset-based. Pass the opaque `nextCursor` back as `cursor`; there are
      no page numbers, so page 10,000 costs the same as page 1.
    - **Concurrency**: draft saves send `If-Match: <revNo>`; a stale value returns 412.
    - **Idempotency**: create-style POSTs accept an `Idempotency-Key` header.
    - **Rate limits**: 429 responses carry `Retry-After` in seconds.
servers:
  - url: http://localhost:9300
    description: Local development

security:
  - {}
  - bearerAuth: []

tags:
  - name: health
    description: Probes for the load balancer and orchestrator.
  - name: me
    description: The signed-in user's own profile and state.
  - name: taxonomy
    description: Category tree (site sections) and tags.
  - name: uploads
    description: |
      Direct-to-storage uploads. 1) POST /v1/studio/uploads with the file's type, size and
      SHA-256. 2) PUT the bytes to `upload.url`, sending every header in `upload.headers`.
      3) POST .../complete. A 202 means a large file is still being verified; poll GET until
      READY. Content references a READY image as `![alt](asset:<id>)`.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness. The process is up; dependencies are not checked.
      security: []
      responses:
        "200": { description: Alive }
  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness. Postgres (primary and replica) and Redis are reachable.
      security: []
      responses:
        "200": { description: Ready to serve traffic }
        "500": { $ref: "#/components/responses/Problem" }

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The signed-in user's CMS profile and editorial roles.
      description: Creates the profile on the user's first authenticated request.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/public/categories:
    get:
      tags: [taxonomy]
      operationId: listRootCategories
      summary: Top-level sections.
      security: []
      responses:
        "200":
          description: Root categories in display order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Category" } }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/public/categories/{path}:
    get:
      tags: [taxonomy]
      operationId: getCategoryByPath
      summary: A category with its breadcrumb and children.
      description: "`path` is the slash-separated slug path, e.g. `dsa/algorithms/searching`."
      security: []
      parameters:
        - { name: path, in: path, required: true, schema: { type: string }, example: dsa/algorithms }
      responses:
        "200":
          description: Category view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryView" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/public/tags:
    get:
      tags: [taxonomy]
      operationId: listTags
      summary: Tags of one kind, alphabetically (keyset-paginated).
      security: []
      parameters:
        - { name: kind, in: query, required: true, schema: { $ref: "#/components/schemas/TagKind" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of tags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagPage" }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/public/tags/search:
    get:
      tags: [taxonomy]
      operationId: searchTags
      summary: Typo-tolerant tag autocomplete (top 20).
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/TagKind" } }
      responses:
        "200":
          description: Matching tags, best first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/public/tags/{kind}/{slug}:
    get:
      tags: [taxonomy]
      operationId: getTag
      summary: One tag, for its listing page header.
      security: []
      parameters:
        - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/TagKind" } }
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/admin/categories:
    post:
      tags: [taxonomy]
      operationId: createCategory
      summary: Create a category. Top-level needs ADMIN; a child needs EDITOR on the parent.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCategory" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/categories/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    patch:
      tags: [taxonomy]
      operationId: updateCategory
      summary: Edit name, description, SEO overrides and position (EDITOR on the category).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCategory" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [taxonomy]
      operationId: deleteCategory
      summary: Delete an empty category (no children, no content).
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/categories/{id}/move:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [taxonomy]
      operationId: moveCategory
      summary: Re-parent and/or rename; the whole subtree moves atomically.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveCategory" }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/tags:
    post:
      tags: [taxonomy]
      operationId: createTag
      summary: Create a tag (EDITOR).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTag" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/admin/tags/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    patch:
      tags: [taxonomy]
      operationId: updateTag
      summary: Rename or re-describe a tag (EDITOR). Slug and kind are fixed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTag" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [taxonomy]
      operationId: deleteTag
      summary: Delete a tag and detach it from all content (ADMIN).
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/studio/uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Get a presigned upload URL (or the existing file, if these exact bytes were uploaded before).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUpload" }
      responses:
        "201":
          description: Upload URL issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "200":
          description: Identical file already uploaded; no upload needed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/studio/uploads/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [uploads]
      operationId: getUpload
      summary: Current state of one of your uploads.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: File
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/studio/uploads/{id}/complete:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [uploads]
      operationId: completeUpload
      summary: Verify the uploaded bytes (size, type, SHA-256). Idempotent.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Verified and READY
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "202":
          description: Large file queued for verification (VERIFYING); poll GET
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: "Not uploaded yet (`upload.missing`) or bytes did not match (`upload.mismatch`, `upload.quarantined`)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from the shared auth service (audience `code-sprout-cms`).

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`. Omit for the first page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Bad Request }
        status: { type: integer, example: 400 }
        detail: { type: string }
        code:
          type: string
          description: Stable identifier clients may switch on, e.g. `content.slug_taken`.
          example: validation_failed
        errors:
          type: object
          description: Per-field messages for validation failures.
          additionalProperties: { type: string }
        requestId: { type: string, description: Quote this when reporting a problem. }

    CmsRole:
      type: string
      enum: [CONTRIBUTOR, REVIEWER, EDITOR, ADMIN]

    RoleGrant:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/CmsRole" }
        scopeCategoryId:
          type: integer
          format: int64
          description: The role applies within this category subtree only. Absent means everywhere.

    Me:
      type: object
      required: [id, handle, displayName, bio, avatarFileId, createdAt, roles, isAdmin, isGuest]
      properties:
        id: { type: integer, format: int64 }
        handle: { type: [string, "null"], description: "Public profile handle, used in /u/{handle}." }
        displayName: { type: string }
        bio: { type: [string, "null"] }
        avatarFileId: { type: [integer, "null"], format: int64 }
        createdAt: { type: string, format: date-time }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleGrant" }
        isAdmin: { type: boolean, description: "Auth ROLE_ADMIN, which grants every CMS permission." }
        isGuest: { type: boolean, description: "Guest account: may read and react, cannot author." }

    Category:
      type: object
      required: [id, parentId, path, slug, name, description, position, seo, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        parentId: { type: [integer, "null"], format: int64 }
        path: { type: string, description: "Slash-separated slug path, e.g. dsa/algorithms." }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        position: { type: number, description: Sibling order (ascending). }
        seo: { type: object, description: Meta title/description overrides. }
        updatedAt: { type: string, format: date-time }
    CategoryView:
      allOf:
        - $ref: "#/components/schemas/Category"
        - type: object
          required: [ancestors, children]
          properties:
            ancestors:
              description: Root-first breadcrumb, excluding this category.
              type: array
              items: { $ref: "#/components/schemas/Category" }
            children:
              type: array
              items: { $ref: "#/components/schemas/Category" }
    CreateCategory:
      type: object
      required: [slug, name]
      additionalProperties: false
      properties:
        parentId: { type: [integer, "null"], format: int64, description: Omit for a top-level section. }
        slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 80 }
        name: { type: string, maxLength: 120 }
        description: { type: [string, "null"] }
        position: { type: number, description: Omit to append after the last sibling. }
    UpdateCategory:
      type: object
      required: [name, position]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: [string, "null"] }
        seo: { type: object }
        position: { type: number }
    MoveCategory:
      type: object
      required: [slug]
      additionalProperties: false
      properties:
        parentId: { type: [integer, "null"], format: int64, description: null makes it top-level (ADMIN). }
        slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 80 }

    TagKind:
      type: string
      enum: [TOPIC, COMPANY, LANGUAGE, PATTERN]
    Tag:
      type: object
      required: [id, kind, slug, name, description]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/TagKind" }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
    TagPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        nextCursor: { type: [string, "null"], description: Pass as `cursor` for the next page; null on the last. }
    CreateTag:
      type: object
      required: [kind, slug, name]
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/TagKind" }
        slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 80 }
        name: { type: string, maxLength: 120 }
        description: { type: [string, "null"] }
    UpdateTag:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: [string, "null"] }

    FilePurpose:
      type: string
      enum: [ASSET, AVATAR, TEST_SET, CHECKER]
      description: |
        ASSET: png/jpeg/webp/gif ≤ 10 MiB, mp4/webm ≤ 500 MiB (public).
        AVATAR: png/jpeg/webp ≤ 2 MiB (public).
        TEST_SET: zip or ndjson ≤ 1 GiB (private). CHECKER: text/plain ≤ 1 MiB (private).
    File:
      type: object
      required: [id, purpose, mime, sizeBytes, status, width, height, url]
      properties:
        id: { type: integer, format: int64 }
        purpose: { $ref: "#/components/schemas/FilePurpose" }
        mime: { type: string }
        sizeBytes: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, VERIFYING, READY, QUARANTINED] }
        width: { type: [integer, "null"], description: Images only. }
        height: { type: [integer, "null"] }
        url: { type: [string, "null"], description: Public files once READY; private files never have one. }
    CreateUpload:
      type: object
      required: [purpose, mime, sizeBytes, sha256]
      additionalProperties: false
      properties:
        purpose: { $ref: "#/components/schemas/FilePurpose" }
        mime: { type: string, example: image/png }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "SHA-256 of the exact bytes to upload, as hex." }
    UploadTicket:
      type: object
      required: [file, upload, alreadyUploaded]
      properties:
        file: { $ref: "#/components/schemas/File" }
        alreadyUploaded: { type: boolean }
        upload:
          oneOf:
            - type: "null"
            - type: object
              required: [url, method, headers, expiresAt]
              properties:
                url: { type: string }
                method: { type: string, enum: [PUT] }
                headers:
                  type: object
                  additionalProperties: { type: string }
                  description: Send every one exactly; they are part of the signature.
                expiresAt: { type: string, format: date-time }
