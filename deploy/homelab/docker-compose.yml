# ─────────────────────────────────────────────────────────────────────────────
#  Code Sprout CMS on a shared homelab host.
#
#  Convention (matches ls-judge, pdf-studio, chat-craft, silent-whisper on this host):
#    env  →  /etc/code-sprout-cms/prod.env     (secrets, 0600, root:root; env_file only)
#    data →  /var/lib/code-sprout-cms/<store>  (postgres, redis, meili)
#    logs →  /var/log/code-sprout-cms/         (bind mounts)
#    net  →  per-service bridge network
#    ports → 127.0.0.1 only; the host Caddy terminates TLS and reverse-proxies
#
#  Secrets flow through env_file (never compose-time ${substitution}): the setup script
#  renders /etc/code-sprout-cms/prod.env with every value fully resolved. Only operator-
#  facing knobs (ports, build args, domains) are read from ./env at compose time.
#
#  Auth: shared ls-judge-auth service (systemd on the host, 127.0.0.1:8081). This stack
#  does NOT run its own auth jar or auth-db. Add `code-sprout-cms` to the shared auth's
#  AUTH_JWT_ALLOWED_AUDIENCES so JWTs minted for this product verify here.
#
#  Media: AWS S3 directly. The public bucket (images, videos) is fronted by an AWS
#  CloudFront distribution; the private bucket (test sets, checkers, archived revisions)
#  is accessed only via presigned URLs. No SeaweedFS is run on this host.
#
#  First run:
#    sudo ./setup.sh                       # dirs, env; prints the remaining manual steps
#    ./deploy.sh                           # build, migrate, start
# ─────────────────────────────────────────────────────────────────────────────
name: code-sprout-cms

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-service: &service
  restart: unless-stopped
  env_file: [/etc/code-sprout-cms/prod.env]
  networks: [code-sprout-cms-network]
  <<: *logging

services:
  # ── data stores ────────────────────────────────────────────────────────────
  postgres:
    <<: *service
    image: postgres:17-alpine
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from env_file.
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c max_connections=200
    volumes: ["/var/lib/code-sprout-cms/postgres:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5442}:5432"]
    shm_size: 256m
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprout -d sprout"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    <<: *service
    image: redis:7.4-alpine
    # Append-only file: counters buffered between flushes survive a restart. The shell form
    # lets the container expand $REDIS_PASSWORD at runtime from env_file (compose would need
    # the value at interpolation time, which contradicts "secrets live only in prod.env").
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["/var/lib/code-sprout-cms/redis:/data"]
    ports: ["127.0.0.1:${REDIS_PORT:-6389}:6379"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  meilisearch:
    <<: *service
    image: getmeili/meilisearch:v1.11
    # MEILI_MASTER_KEY comes from env_file; MEILI_ENV / MEILI_NO_ANALYTICS are static.
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes: ["/var/lib/code-sprout-cms/meili:/meili_data"]
    ports: ["127.0.0.1:${SEARCH_PORT:-7710}:7700"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:7700/health || wget -q -O /dev/null http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ── Code Sprout CMS ────────────────────────────────────────────────────────
  # One-shot: applies pending database migrations, then exits. Runs on every deploy.
  migrate:
    <<: *logging
    image: codesprout-cms/migrate:latest
    build: { context: ../.., target: migrate }
    env_file: [/etc/code-sprout-cms/prod.env]  # GOOSE_DBSTRING lives here, pre-resolved.
    depends_on:
      postgres: { condition: service_healthy }
    networks: [code-sprout-cms-network]
    restart: "no"

  api:
    <<: *service
    image: codesprout-cms/api:latest
    build: { context: ../.., target: api }
    # Published on loopback for the web image build, which prerenders pages from the API.
    ports: ["127.0.0.1:${API_PORT:-4411}:9300"]
    mem_limit: 512m
    # The shared auth service runs as systemd on the host; reach it via the host gateway.
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["/var/log/code-sprout-cms/api:/var/log/code-sprout-cms"]
    depends_on: &cms-deps
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_healthy }

  worker:
    <<: *service
    image: codesprout-cms/worker:latest
    build: { context: ../.., target: worker }
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["/var/log/code-sprout-cms/worker:/var/log/code-sprout-cms"]
    mem_limit: 512m
    depends_on: *cms-deps

  web:
    <<: *service
    image: codesprout-cms/web:latest
    build:
      context: "${WEB_REPO:?set WEB_REPO in ./env}"
      dockerfile: apps/code-sprout-cms/Dockerfile
      # Static pages are prerendered from the running API (see deploy.sh for the order).
      network: host
      args:
        CMS_API_URL: ${WEB_BUILD_API_URL:-http://127.0.0.1:4411}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SCHEME:-https}://${SITE_DOMAIN:?set SITE_DOMAIN in ./env}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_YOUTUBE_CHANNEL_URL: ${YOUTUBE_CHANNEL_URL:-}
        STORAGE_MEDIA_URL: ${PUBLIC_SCHEME:-https}://${MEDIA_DOMAIN:?set MEDIA_DOMAIN in ./env}
        STORAGE_UPLOAD_URL: ${STORAGE_UPLOAD_ORIGIN:-https://s3.ap-south-1.amazonaws.com}
    # The web container needs a few extras on top of prod.env (operator-facing + static
    # inter-container URLs). Secrets (REVALIDATE_SECRET, INTERNAL_PROXY_SECRET) come from
    # prod.env via env_file above.
    environment:
      CMS_API_URL: http://api:9300
      AUTH_URL: http://host.docker.internal:8081
      AUTH_AUDIENCE: code-sprout-cms
      CLIENT_IP_HEADER: x-real-ip
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    ports: ["127.0.0.1:${WEB_PORT:-4410}:4410"]
    mem_limit: 768m
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["/var/log/code-sprout-cms/web:/app/logs"]
    depends_on:
      api: { condition: service_healthy }

networks:
  code-sprout-cms-network:
    driver: bridge
