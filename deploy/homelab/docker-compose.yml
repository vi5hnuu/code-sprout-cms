# ─────────────────────────────────────────────────────────────────────────────
#  Code Sprout on one Linux host: web, API, worker, auth and every backing service.
#
#  First run (from this directory):
#    cp .env.example .env      # fill in every CHANGE_ME (each says how to generate it)
#    ./setup.sh                # data folders, auth signing key, storage config
#    ./deploy.sh               # build, migrate, start; prints what is healthy
#  Then import the Caddy snippets in ./caddy into the host's Caddyfile (setup.sh prints the
#  lines) and reload Caddy. Updates: pull the repositories, run ./deploy.sh again.
#
#  Data: every byte of state lives under ${DATA_DIR} on the host (bind mounts, no named
#  volumes), so `docker compose down` (even with -v), image upgrades and container rebuilds
#  never lose anything. Back it up with ./backup.sh (cron or a systemd timer).
#
#  Network: only the host's loopback is published (web, media, auth, and the API for the web
#  image build); the host's Caddy terminates TLS and proxies to them. Databases, Redis and
#  search are reachable only inside this stack.
# ─────────────────────────────────────────────────────────────────────────────
name: codesprout

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-service: &service
  restart: unless-stopped
  <<: *logging

services:
  # ── data stores ────────────────────────────────────────────────────────────
  postgres:
    <<: *service
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sprout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: sprout
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c max_connections=200
    volumes: ["${DATA_DIR:-/srv/codesprout}/postgres:/var/lib/postgresql/data"]
    shm_size: 256m
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprout -d sprout"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    <<: *service
    image: redis:7.4-alpine
    # Append-only file: counters buffered between flushes survive a restart.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set in .env}"]
    volumes: ["${DATA_DIR:-/srv/codesprout}/redis:/data"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # S3-compatible object storage for images, videos and test sets. Browsers upload to it with
  # presigned URLs and read the public bucket through ${MEDIA_DOMAIN} (host Caddy).
  seaweedfs:
    <<: *service
    image: chrislusf/seaweedfs:3.80
    command: ["server", "-ip=seaweedfs", "-ip.bind=0.0.0.0", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - "${DATA_DIR:-/srv/codesprout}/seaweedfs:/data"
      - "${DATA_DIR:-/srv/codesprout}/config/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro"
    ports: ["127.0.0.1:${MEDIA_PORT:-4412}:8333"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot: the two buckets the API uses. Safe to re-run (existing buckets are kept).
  storage-init:
    <<: *logging
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["sh", "-c"]
    command:
      - |
        for b in sprout-public sprout-private; do
          echo "s3.bucket.create -name $$b" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 2>&1 | grep -v -i "already exist" || true
        done
        echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 | grep -q sprout-private
    depends_on:
      seaweedfs: { condition: service_healthy }
    restart: "no"

  meilisearch:
    <<: *service
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set in .env}
      MEILI_NO_ANALYTICS: "true"
    volumes: ["${DATA_DIR:-/srv/codesprout}/meili:/meili_data"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:7700/health || wget -q -O /dev/null http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ── auth: a dedicated instance (its own users, database and signing key) ───
  auth-db:
    <<: *service
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:?set in .env}
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:?set in .env}
    volumes: ["${DATA_DIR:-/srv/codesprout}/mysql:/var/lib/mysql"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  auth:
    <<: *service
    image: codesprout/auth:latest
    # Built unchanged from the auth repository (its own Dockerfile).
    build: { context: "${AUTH_REPO:?set in .env}" }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8081"
      JAVA_OPTS: ${AUTH_JAVA_OPTS:--Xmx512m}
      DB_URL: jdbc:mysql://auth-db:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: auth
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JPA_DDL_AUTO: update
      AUTH_JWT_ISSUER: ${PUBLIC_SCHEME:-https}://${AUTH_DOMAIN:?set in .env}
      AUTH_JWT_KID: codesprout-key-1
      AUTH_JWT_PRIVATE_KEY_LOCATION: file:/app/keys/private.pem
      AUTH_JWT_PUBLIC_KEY_LOCATION: file:/app/keys/public.pem
      AUTH_JWT_ALLOWED_AUDIENCES: code-sprout-cms
      AUTH_JWT_DEFAULT_AUDIENCE: code-sprout-cms
      AUTH_CORS_ALLOWED_ORIGINS: ${PUBLIC_SCHEME:-https}://${SITE_DOMAIN}
      AUTH_GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_ID:-}
      AUTH_VERIFY_BASE_URL: ${PUBLIC_SCHEME:-https}://${AUTH_DOMAIN}/api/v1/auth/verify
      AUTH_RESET_BASE_URL: ${PUBLIC_SCHEME:-https}://${AUTH_DOMAIN}/api/v1/auth/reset-password
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-no-reply@laxmi.solutions}
      AWS_SES_REGION: ${AWS_SES_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY:-}
      MAIL_DISPATCHER_ENABLED: ${AUTH_MAIL_ENABLED:-true}
    volumes: ["${DATA_DIR:-/srv/codesprout}/auth/keys:/app/keys:ro"]
    ports: ["127.0.0.1:${AUTH_PORT:-4413}:8081"]
    mem_limit: 768m
    depends_on:
      auth-db: { condition: service_healthy }
    healthcheck:
      # The JRE image has wget but no curl (as in the auth repository's own compose file).
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Code Sprout ────────────────────────────────────────────────────────────
  # One-shot: applies pending database migrations, then exits. Runs on every deploy.
  migrate:
    <<: *logging
    image: codesprout/migrate:latest
    build: { context: ../.., target: migrate }
    environment:
      GOOSE_DBSTRING: postgres://sprout:${POSTGRES_PASSWORD}@postgres:5432/sprout?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *service
    image: codesprout/api:latest
    build: { context: ../.., target: api }
    environment: &cms-env
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://sprout:${POSTGRES_PASSWORD}@postgres:5432/sprout?sslmode=disable
      DATABASE_MAX_CONNS: "40"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTH_JWKS_URL: http://auth:8081/.well-known/jwks.json
      AUTH_ISSUER: ${PUBLIC_SCHEME:-https}://${AUTH_DOMAIN}
      AUTH_AUDIENCE: code-sprout-cms
      # The API is only reached by the web server, which relays the reader's address with
      # this shared secret (X-Internal-Proxy); no client header is trusted on its own.
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:?set in .env}
      CORS_ORIGINS: ${PUBLIC_SCHEME:-https}://${SITE_DOMAIN:?set in .env}
      STORAGE_ENDPOINT: http://seaweedfs:8333
      STORAGE_PUBLIC_ENDPOINT: ${PUBLIC_SCHEME:-https}://${MEDIA_DOMAIN:?set in .env}
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?set in .env}
      STORAGE_PUBLIC_BUCKET: sprout-public
      STORAGE_PRIVATE_BUCKET: sprout-private
      STORAGE_PUBLIC_BASE_URL: ${PUBLIC_SCHEME:-https}://${MEDIA_DOMAIN}/sprout-public
      SEARCH_URL: http://meilisearch:7700
      SEARCH_API_KEY: ${MEILI_MASTER_KEY}
      JUDGE_URL: ${JUDGE_URL:-}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
      SITE_URL: ${PUBLIC_SCHEME:-https}://${SITE_DOMAIN}
      WEB_REVALIDATE_URL: http://web:4410/api/revalidate
      WEB_REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set in .env}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_CHANNEL_IDS: ${YOUTUBE_CHANNEL_IDS:-}
      YOUTUBE_OWNER_HANDLE: ${YOUTUBE_OWNER_HANDLE:-}
    # Published on loopback for the web image build, which prerenders pages from the API.
    ports: ["127.0.0.1:${API_PORT:-4411}:9300"]
    mem_limit: 512m
    depends_on: &cms-deps
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
      auth: { condition: service_healthy }

  worker:
    <<: *service
    image: codesprout/worker:latest
    build: { context: ../.., target: worker }
    environment: *cms-env
    mem_limit: 512m
    depends_on: *cms-deps

  web:
    <<: *service
    image: codesprout/web:latest
    build:
      context: "${WEB_REPO:?set in .env}"
      dockerfile: apps/code-sprout-cms/Dockerfile
      # Static pages are prerendered from the running API (see deploy.sh for the order).
      network: host
      args:
        CMS_API_URL: ${WEB_BUILD_API_URL:-http://127.0.0.1:4411}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SCHEME:-https}://${SITE_DOMAIN}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_YOUTUBE_CHANNEL_URL: ${YOUTUBE_CHANNEL_URL:-}
        STORAGE_MEDIA_URL: ${PUBLIC_SCHEME:-https}://${MEDIA_DOMAIN}
        STORAGE_UPLOAD_URL: ${PUBLIC_SCHEME:-https}://${MEDIA_DOMAIN}
    environment:
      CMS_API_URL: http://api:9300
      AUTH_URL: http://auth:8081
      AUTH_AUDIENCE: code-sprout-cms
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      ANDROID_APP_CERT_SHA256: ${ANDROID_APP_CERT_SHA256:-}
      # The host Caddy sets X-Real-IP to the reader's address (see caddy/codesprout-web.caddy).
      CLIENT_IP_HEADER: x-real-ip
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    ports: ["127.0.0.1:${WEB_PORT:-4410}:4410"]
    mem_limit: 768m
    depends_on:
      api: { condition: service_healthy }
